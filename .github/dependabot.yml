version: 2
updates:
  - package-ecosystem: gomod
    directory: /receiver/tetragonreceiver
    schedule:
      interval: weekly
    groups:
      otel:
        patterns:
          - "go.opentelemetry.io/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /container
    schedule:
      interval: weekly
