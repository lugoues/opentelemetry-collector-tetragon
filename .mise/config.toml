[tools]
go = "1.25"

[tasks.test]
description = "Run receiver unit tests with race detector"
run = "go test -race ./..."
dir = "receiver/tetragonreceiver"

[tasks.lint]
description = "Run go vet on receiver module"
run = "go vet ./..."
dir = "receiver/tetragonreceiver"

[tasks.build]
description = "Build receiver module"
run = "go build ./..."
dir = "receiver/tetragonreceiver"

[tasks.tidy]
description = "Tidy receiver module dependencies"
run = "go mod tidy"
dir = "receiver/tetragonreceiver"

[tasks.ocb]
description = "Build custom OTel Collector binary with OCB"
run = "builder --config distribution/builder-config.yaml --output-path /tmp/otelcol-tetragon --skip-strict-versioning"

[tasks.container]
description = "Build container image"
run = "docker build -t otelcol-tetragon:local -f container/Containerfile ."

[tasks.smoke]
description = "Run container smoke test: start, check health endpoint, stop"
run = """
docker run -d --name otelcol-smoke -p 13133:13133 \
  -e TETRAGON_ENDPOINT=localhost:54321 \
  -e OTEL_EXPORTER_ENDPOINT=http://localhost:4318 \
  -e OTEL_AUTH=dGVzdDp0ZXN0 \
  -v "$(pwd)/container/rootfs/etc/otelcol/config.yaml:/etc/otelcol/config.yaml:ro" \
  otelcol-tetragon:local 2>/dev/null || true
sleep 5
curl -sf http://localhost:13133/ && echo "HEALTHY" || echo "UNHEALTHY"
docker rm -f otelcol-smoke 2>/dev/null || true
"""
